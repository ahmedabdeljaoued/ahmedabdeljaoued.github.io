name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event.head_commit.message != 'chore: publish Astro site [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: signal-pipeline/package-lock.json

      - name: Install dependencies
        working-directory: signal-pipeline
        run: npm ci

      - name: Build
        working-directory: signal-pipeline
        run: npm run build

      - name: Sync build to repository root
        run: |
          rm -rf _astro
          cp -R signal-pipeline/dist/_astro ./_astro
          mkdir -p documents images
          cp -f signal-pipeline/dist/documents/* documents/
          cp -f signal-pipeline/dist/images/* images/
          cp -f signal-pipeline/dist/index.html ./index.html
          cp -f signal-pipeline/dist/favicon.ico signal-pipeline/dist/favicon.png signal-pipeline/dist/favicon.svg ./

      - name: Commit published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _astro documents images favicon.ico favicon.png favicon.svg
          if git diff --staged --quiet; then
            echo "No publish changes"
          else
            git commit -m "chore: publish Astro site [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: signal-pipeline/dist

  deploy:
    needs: build-and-publish
    if: github.event.head_commit.message != 'chore: publish Astro site [skip ci]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
