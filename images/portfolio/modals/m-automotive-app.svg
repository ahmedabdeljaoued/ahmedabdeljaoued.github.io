<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Full-stack data application graphic">
  <defs>
    <linearGradient id="fsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F2A"/>
      <stop offset="50%" stop-color="#123447"/>
      <stop offset="100%" stop-color="#0F4C5C"/>
    </linearGradient>
    <linearGradient id="fsAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F9EA3"/>
    </linearGradient>
    <linearGradient id="fsCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <linearGradient id="fsBrowser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3340"/>
      <stop offset="100%" stop-color="#142A35"/>
    </linearGradient>
    <filter id="fsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#fsBg)"/>
  <circle cx="520" cy="60" r="130" fill="#2DD4BF" opacity="0.10"/>
  <circle cx="60" cy="340" r="120" fill="#0F9EA3" opacity="0.12"/>

  <!-- Browser window (frontend) -->
  <g transform="translate(40 52)">
    <rect width="320" height="230" rx="14" fill="url(#fsBrowser)" stroke="rgba(45,212,191,0.35)" stroke-width="1.5"/>
    <rect width="320" height="34" rx="14" fill="#0E2430"/>
    <rect y="20" width="320" height="14" fill="#0E2430"/>
    <circle cx="22" cy="17" r="5" fill="#FF5F56"/>
    <circle cx="40" cy="17" r="5" fill="#FFBD2E"/>
    <circle cx="58" cy="17" r="5" fill="#27C93F"/>
    <rect x="84" y="10" width="180" height="14" rx="7" fill="rgba(255,255,255,0.08)"/>

    <!-- App UI -->
    <rect x="18" y="50" width="70" height="160" rx="10" fill="#102A36" stroke="rgba(45,212,191,0.2)"/>
    <rect x="30" y="68" width="46" height="8" rx="4" fill="#2DD4BF"/>
    <rect x="30" y="88" width="40" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
    <rect x="30" y="104" width="40" height="6" rx="3" fill="rgba(255,255,255,0.18)"/>
    <rect x="30" y="120" width="40" height="6" rx="3" fill="rgba(255,255,255,0.18)"/>
    <rect x="30" y="136" width="40" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>

    <rect x="100" y="50" width="200" height="42" rx="10" fill="#102A36" stroke="rgba(45,212,191,0.2)"/>
    <rect x="114" y="64" width="90" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
    <rect x="114" y="78" width="120" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>

    <rect x="100" y="104" width="94" height="106" rx="10" fill="#102A36" stroke="rgba(45,212,191,0.2)"/>
    <rect x="114" y="150" width="20" height="44" rx="4" fill="#2DD4BF" opacity="0.55"/>
    <rect x="140" y="134" width="20" height="60" rx="4" fill="#2DD4BF" opacity="0.75"/>
    <rect x="166" y="120" width="20" height="74" rx="4" fill="#0F9EA3"/>

    <rect x="206" y="104" width="94" height="106" rx="10" fill="#102A36" stroke="rgba(45,212,191,0.2)"/>
    <circle cx="253" cy="148" r="28" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>
    <circle cx="253" cy="148" r="28" fill="none" stroke="#2DD4BF" stroke-width="8" stroke-dasharray="110 176" stroke-linecap="round" transform="rotate(-90 253 148)"/>
  </g>

  <!-- API / NestJS node -->
  <g transform="translate(390 70)" filter="url(#fsGlow)">
    <rect width="170" height="86" rx="14" fill="url(#fsCard)" stroke="rgba(45,212,191,0.4)" stroke-width="1.5"/>
    <text x="18" y="32" fill="#2DD4BF" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="600">NESTJS API</text>
    <rect x="18" y="46" width="52" height="18" rx="6" fill="#0F9EA3"/>
    <text x="28" y="59" fill="#fff" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">POST</text>
    <rect x="78" y="48" width="70" height="8" rx="4" fill="rgba(255,255,255,0.28)"/>
    <rect x="78" y="62" width="54" height="6" rx="3" fill="rgba(255,255,255,0.16)"/>
  </g>

  <!-- Databricks / data node -->
  <g transform="translate(390 174)">
    <rect width="170" height="86" rx="14" fill="url(#fsCard)" stroke="rgba(45,212,191,0.4)" stroke-width="1.5"/>
    <text x="18" y="32" fill="#2DD4BF" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="600">DATABRICKS</text>
    <rect x="18" y="48" width="14" height="22" rx="3" fill="#2DD4BF" opacity="0.5"/>
    <rect x="38" y="40" width="14" height="30" rx="3" fill="#2DD4BF" opacity="0.75"/>
    <rect x="58" y="34" width="14" height="36" rx="3" fill="#0F9EA3"/>
    <rect x="86" y="48" width="64" height="8" rx="4" fill="rgba(255,255,255,0.25)"/>
    <rect x="86" y="62" width="48" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  </g>

  <!-- Connection lines -->
  <path d="M360 120 C375 120, 375 113, 390 113" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="5 5" opacity="0.8"/>
  <path d="M360 200 C375 200, 375 217, 390 217" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="5 5" opacity="0.65"/>
  <circle cx="360" cy="120" r="4" fill="#2DD4BF"/>
  <circle cx="360" cy="200" r="4" fill="#2DD4BF"/>

  <!-- Azure chip -->
  <g transform="translate(40 308)">
    <rect width="120" height="36" rx="18" fill="#0078D4"/>
    <text x="60" y="23" text-anchor="middle" fill="#fff" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">AZURE</text>
  </g>
  <g transform="translate(172 308)">
    <rect width="120" height="36" rx="18" fill="rgba(45,212,191,0.18)" stroke="#2DD4BF"/>
    <text x="60" y="23" text-anchor="middle" fill="#2DD4BF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">NEXT.JS</text>
  </g>

  <text x="320" y="372" fill="#2DD4BF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="1">FULL-STACK</text>
  <text x="450" y="372" fill="rgba(255,255,255,0.7)" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16" font-weight="500">· Data App</text>
</svg>
