<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Power BI inspired dashboard graphic">
  <defs>
    <linearGradient id="pbiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1A19"/>
      <stop offset="55%" stop-color="#252423"/>
      <stop offset="100%" stop-color="#3B3A39"/>
    </linearGradient>
    <linearGradient id="pbiYellow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C9A206"/>
      <stop offset="100%" stop-color="#F2C811"/>
    </linearGradient>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  
  <rect width="600" height="400" fill="url(#pbiBg)"/>
  <circle cx="520" cy="40" r="120" fill="#F2C811" opacity="0.12"/>
  <circle cx="80" cy="360" r="140" fill="#F2C811" opacity="0.08"/>

  
  <rect x="36" y="48" width="528" height="304" rx="18" fill="url(#cardGlass)" stroke="rgba(242,200,17,0.28)" stroke-width="1.5"/>

  
  <rect x="56" y="68" width="160" height="14" rx="7" fill="#F2C811"/>
  <rect x="230" y="72" width="70" height="8" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="310" y="72" width="48" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>

  
  <rect x="56" y="104" width="118" height="72" rx="12" fill="#2D2C2B" stroke="rgba(242,200,17,0.2)"/>
  <rect x="72" y="118" width="54" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
  <rect x="72" y="138" width="78" height="18" rx="6" fill="#F2C811"/>

  <rect x="186" y="104" width="118" height="72" rx="12" fill="#2D2C2B" stroke="rgba(242,200,17,0.2)"/>
  <rect x="202" y="118" width="54" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
  <rect x="202" y="138" width="66" height="18" rx="6" fill="#E6B800"/>

  <rect x="316" y="104" width="118" height="72" rx="12" fill="#2D2C2B" stroke="rgba(242,200,17,0.2)"/>
  <rect x="332" y="118" width="54" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
  <rect x="332" y="138" width="72" height="18" rx="6" fill="#F2C811"/>

  
  <g transform="translate(500 140)" filter="url(#softGlow)">
    <circle r="34" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="12"/>
    <circle r="34" fill="none" stroke="#F2C811" stroke-width="12" stroke-dasharray="140 214" stroke-linecap="round" transform="rotate(-90)"/>
    <circle r="34" fill="none" stroke="#C9A206" stroke-width="12" stroke-dasharray="50 214" stroke-dashoffset="-140" stroke-linecap="round" transform="rotate(-90)"/>
    <circle r="18" fill="#252423"/>
  </g>

  
  <g transform="translate(56 210)">
    <rect x="0" y="0" width="300" height="110" rx="12" fill="#2D2C2B" stroke="rgba(242,200,17,0.18)"/>
    <rect x="24" y="78" width="28" height="18" rx="4" fill="#F2C811" opacity="0.55"/>
    <rect x="64" y="58" width="28" height="38" rx="4" fill="#F2C811" opacity="0.7"/>
    <rect x="104" y="36" width="28" height="60" rx="4" fill="#F2C811"/>
    <rect x="144" y="48" width="28" height="48" rx="4" fill="#E6B800"/>
    <rect x="184" y="24" width="28" height="72" rx="4" fill="#F2C811"/>
    <rect x="224" y="42" width="28" height="54" rx="4" fill="#C9A206"/>
    <rect x="20" y="96" width="240" height="2" fill="rgba(255,255,255,0.12)"/>
  </g>

  
  <rect x="380" y="210" width="160" height="110" rx="12" fill="#2D2C2B" stroke="rgba(242,200,17,0.18)"/>
  <rect x="398" y="230" width="10" height="10" rx="2" fill="#F2C811"/>
  <rect x="416" y="232" width="90" height="7" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="398" y="254" width="10" height="10" rx="2" fill="#E6B800"/>
  <rect x="416" y="256" width="70" height="7" rx="3" fill="rgba(255,255,255,0.3)"/>
  <rect x="398" y="278" width="10" height="10" rx="2" fill="#A88B08"/>
  <rect x="416" y="280" width="84" height="7" rx="3" fill="rgba(255,255,255,0.25)"/>

  
  <text x="56" y="372" fill="#F2C811" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">POWER BI</text>
  <text x="156" y="372" fill="rgba(255,255,255,0.7)" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16" font-weight="500">· Governance</text>
</svg>
